# Browser Configuration
# Options: chrome, firefox, webkit, edge
browser=chrome

# Use the locally installed Chrome/Edge browser instead of a Playwright-managed browser.
useInstalledBrowser=true
# Optional absolute browser executable path. Leave empty to use the browser channel.
browserExecutablePath=

# Application Configuration
baseUrl=https://www.bing.com

# Playwright timeouts (in seconds)
implicitWait=10
explicitWait=10
pageLoadTimeout=30

# Browser Options
headless=false

# Reporting
screenshotOnFailure=true
